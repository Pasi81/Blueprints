# Versionierung: name enthält die aktuelle Version. Bei jeder Änderung Name + Beschreibung entsprechend anpassen.
# Changelog (nur als Kommentar, da Home Assistant Blueprint-Keys hier nicht erlaubt sind):
# 0.2.0 - 2026-09-12: Zustand und Fahrten werden in einer gemeinsamen JSON-Text-Entität gespeichert; mehrere Blueprint-Aufrufe können dort gesammelt werden.
# 0.1.1 - 2026-09-12: Eingaben für Azimut, Elevation, Mindesttemperaturen und Max. Fahrten können jetzt als fester Wert oder als verknüpfte Entität konfiguriert werden.
# 0.1.0 - 2026-09-12: Initiale Version des Blueprints
blueprint:
  name: Rolladen Automatik V0.2.0
  description: >
    Zustand & Fahrtenzähler werden in einer gemeinsamen JSON-Text-Entität gespeichert. Version 0.2.0.
  domain: automation

  input:

    rollladen:
      name: Rollladen
      selector:
        entity:
          domain: cover

    sonnen_zustand:
      name: Sonnenzustand (0=Nacht, 1=Wolkig, 2=Sonnig)
      selector:
        entity:

    sonnen_azimut:
      name: Sonnenstand – Azimut
      selector:
        entity:

    sonnen_elevation:
      name: Sonnenstand – Elevation
      selector:
        entity:

    temp_aussen:
      name: Außentemperatur
      selector:
        entity:

    temp_vorhersage:
      name: Temperatur Vorhersage
      selector:
        entity:

    json_entity:
      name: JSON-Speicher für Zustand/Fahrten
      default: ""
      selector:
        entity:
          domain: input_text

    azi_start:
      name: Azimut Start (Wert)
      default: 90
      selector:
        number:
          min: 0
          max: 360
          step: 1

    azi_start_entity:
      name: Azimut Start (Entität)
      default: ""
      selector:
        entity:
          domain: sensor

    azi_end:
      name: Azimut Ende (Wert)
      default: 300
      selector:
        number:
          min: 0
          max: 360
          step: 1

    azi_end_entity:
      name: Azimut Ende (Entität)
      default: ""
      selector:
        entity:
          domain: sensor

    elv_start:
      name: Elevation Start (Wert)
      default: 0
      selector:
        number:
          min: -20
          max: 90
          step: 1

    elv_start_entity:
      name: Elevation Start (Entität)
      default: ""
      selector:
        entity:
          domain: sensor

    elv_end:
      name: Elevation Ende (Wert)
      default: 90
      selector:
        number:
          min: -20
          max: 90
          step: 1

    elv_end_entity:
      name: Elevation Ende (Entität)
      default: ""
      selector:
        entity:
          domain: sensor

    einbauwinkel:
      name: Einbauwinkel
      default: 45
      selector:
        number:
          min: 0
          max: 90
          step: 1

    pos_beschattung:
      name: Position Beschattung
      default: 5
      selector:
        number:
          min: 0
          max: 100
          step: 1

    pos_offen:
      name: Position Offen
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1

    pos_zu:
      name: Position Zu
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1

    temp_aussen_min:
      name: Mindesttemperatur Außen (Wert)
      default: 18
      selector:
        number:
          min: -20
          max: 50
          step: 1

    temp_aussen_min_entity:
      name: Mindesttemperatur Außen (Entität)
      default: ""
      selector:
        entity:
          domain: sensor

    temp_vorhersage_min:
      name: Mindesttemperatur Vorhersage (Wert)
      default: 18
      selector:
        number:
          min: -20
          max: 50
          step: 1

    temp_vorhersage_min_entity:
      name: Mindesttemperatur Vorhersage (Entität)
      default: ""
      selector:
        entity:
          domain: sensor

    max_fahrten:
      name: Max. Fahrten pro Tag (Wert)
      default: 10
      selector:
        number:
          min: 1
          max: 14
          step: 1

    max_fahrten_entity:
      name: Max. Fahrten pro Tag (Entität)
      default: ""
      selector:
        entity:
          domain: sensor

    nachts_fahren:
      name: Nachts fahren
      default: true
      selector:
        boolean:

    debug:
      name: Debug Logging aktivieren
      default: false
      selector:
        boolean:

mode: restart

trigger:
  - platform: state
    entity_id: !input sonnen_zustand
  - platform: state
    entity_id: !input sonnen_azimut
  - platform: state
    entity_id: !input sonnen_elevation
  - platform: state
    entity_id: !input temp_aussen
  - platform: state
    entity_id: !input temp_vorhersage

variables:
  rollladen: !input rollladen
  sonnen_zustand_entity: !input sonnen_zustand
  sonnen_azimut_entity: !input sonnen_azimut
  sonnen_elevation_entity: !input sonnen_elevation
  temp_aussen_entity: !input temp_aussen
  temp_vorhersage_entity: !input temp_vorhersage
  json_entity: !input json_entity
  storage_key: "{{ rollladen | replace('.', '_') | replace('-', '_') | replace(' ', '_') }}"
  storage_data: >
    {% set raw = states(json_entity) %}
    {% if raw in ['unknown', 'unavailable', 'none', ''] %}
      {{ {} }}
    {% else %}
      {{ raw | from_json }}
    {% endif %}
  azi_start: !input azi_start
  azi_start_entity: !input azi_start_entity
  azi_end: !input azi_end
  azi_end_entity: !input azi_end_entity
  elv_start: !input elv_start
  elv_start_entity: !input elv_start_entity
  elv_end: !input elv_end
  elv_end_entity: !input elv_end_entity
  einbauwinkel: !input einbauwinkel
  pos_beschattung: !input pos_beschattung
  pos_offen: !input pos_offen
  pos_zu: !input pos_zu
  temp_aussen_min: !input temp_aussen_min
  temp_aussen_min_entity: !input temp_aussen_min_entity
  temp_vorhersage_min: !input temp_vorhersage_min
  temp_vorhersage_min_entity: !input temp_vorhersage_min_entity
  max_fahrten: !input max_fahrten
  max_fahrten_entity: !input max_fahrten_entity
  nachts_fahren: !input nachts_fahren
  azi_start_value: >
    {% set src = azi_start_entity | default('') %}
    {{ states(src) | float(0) if src not in [none, ''] else (azi_start | float) }}
  azi_end_value: >
    {% set src = azi_end_entity | default('') %}
    {{ states(src) | float(0) if src not in [none, ''] else (azi_end | float) }}
  elv_start_value: >
    {% set src = elv_start_entity | default('') %}
    {{ states(src) | float(0) if src not in [none, ''] else (elv_start | float) }}
  elv_end_value: >
    {% set src = elv_end_entity | default('') %}
    {{ states(src) | float(0) if src not in [none, ''] else (elv_end | float) }}
  temp_aussen_min_value: >
    {% set src = temp_aussen_min_entity | default('') %}
    {{ states(src) | float(0) if src not in [none, ''] else (temp_aussen_min | float) }}
  temp_vorhersage_min_value: >
    {% set src = temp_vorhersage_min_entity | default('') %}
    {{ states(src) | float(0) if src not in [none, ''] else (temp_vorhersage_min | float) }}
  max_fahrten_value: >
    {% set src = max_fahrten_entity | default('') %}
    {{ states(src) | int(0) if src not in [none, ''] else (max_fahrten | int) }}
  zustand: >
    {{ storage_data.get(storage_key, {}).get('zustand', 1) | int }}
  fahrten: >
    {{ storage_data.get(storage_key, {}).get('fahrten', 0) | int }}
  sonne: "{{ states(sonnen_zustand_entity) | default(0) | int }}"
  azi: "{{ states(sonnen_azimut_entity) | float }}"
  elv: "{{ states(sonnen_elevation_entity) | float }}"
  tempA: "{{ states(temp_aussen_entity) | float }}"
  tempV: "{{ states(temp_vorhersage_entity) | float }}"
  debug: !input debug

action:

  - choose:
      # ---------------------------------------------------------
      # Zustand 1 Nacht → Offen (nur wenn nachts fahren aktiviert ist)
      # ---------------------------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ zustand == 1 }}"
            alias: Zustand 1 (Nacht)
        sequence:
          - if:
              - condition: template
                value_template: "{{ sonne > 0 }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ nachts_fahren == 1 }}"
                then:
                    - service: cover.set_cover_position
                      target:
                        entity_id: !input rollladen
                      data:
                        position: !input pos_offen
                alias: Rollladen nur öffnen wenn nachts fahren aktiv ist
                
              - service: input_text.set_value
                target:
                  entity_id: !input json_entity
                data:
                  value: >-
                    {% set raw = states(json_entity) %}
                    {% set current = raw | from_json if raw not in ['unknown', 'unavailable', 'none', ''] else {} %}
                    {{ dict(current, **{storage_key: {'zustand': 2, 'fahrten': 0}}) | to_json }}
      # ---------------------------------------------------------
      # Zustand 2 Nicht Beschatten → Nacht oder Beschattung 
      # ---------------------------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ zustand == 2 }}"
        
        sequence:
          - choose:
              - conditions:
                  - alias: Sonne = 0 (Nacht)
                    condition: template
                    value_template: "{{ sonne == 0 }}"
                sequence:
                  - if:
                    - condition: template
                      value_template: "{{ nachts_fahren }}"
                    then:
                        - service: cover.set_cover_position
                          target:
                            entity_id: !input rollladen
                          data:
                            position: !input pos_zu

                  - service: input_text.set_value
                    target:
                      entity_id: !input json_entity
                    data:
                      value: >-
                        {% set raw = states(json_entity) %}
                        {% set current = raw | from_json if raw not in ['unknown', 'unavailable', 'none', ''] else {} %}
                        {{ dict(current, **{storage_key: {'zustand': 1, 'fahrten': fahrten | int}}) | to_json }}
                alias: Sonne = 0 (Nacht)

              - conditions:
                  - condition: template
                    value_template: "{{ sonne == 2 }}"
                    alias: Sonne = 2
                  - condition: template
                    value_template: |
                      {{
                        (
                          azi >= (azi_start_value | int) and
                          azi <  (azi_end_value   | int) and
                          elv >= (elv_start_value | int) and
                          elv <  (elv_end_value   | int)
                        )
                        or
                        (elv >= (einbauwinkel | int))
                      }}
                    alias: Innerhalb Beschattungs Parameter
                  - condition: template
                    value_template: "{{ tempA >= (temp_aussen_min_value | int) }}"
                    alias: Aktuelle Temperatur erreicht
                  - condition: template
                    value_template: "{{ tempV >= (temp_vorhersage_min_value | int) }}"
                    alias: Vorhersage Temperatur erreicht
                sequence:
                  - if:
                      - condition: template
                        value_template: >
                          {{ state_attr(rollladen, 'current_position') | int > (pos_beschattung | int) }}
                        alias: Rolladen steht auf PosBeschattung
                    then:
                      - service: cover.set_cover_position
                        target:
                          entity_id: !input rollladen
                        data:
                          position: !input pos_beschattung

                  - service: input_text.set_value
                    target:
                      entity_id: !input json_entity
                    data:
                      value: >-
                        {% set raw = states(json_entity) %}
                        {% set current = raw | from_json if raw not in ['unknown', 'unavailable', 'none', ''] else {} %}
                        {{ dict(current, **{storage_key: {'zustand': 3, 'fahrten': (fahrten + 1) | int}}) | to_json }}
                alias: Zustand 2 (Beschattung nicht aktiv)

      # ---------------------------------------------------------
      # Zustand 3 Beschattung aktiv → Offen oder Nacht
      # ---------------------------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ zustand == 3 }}"
        sequence:
          - choose:
              # → Öffnen
              - conditions:
                  - condition: or
                    conditions:
                      - alias: " Sonne = 1 und Max Fahren noch nicht überschritten"
                        condition: template
                        value_template: |
                          {{
                            (sonne == 1 and fahrten < (max_fahrten_value | int))
                          }}
                      - alias: Außerhalb Beschattungs Parameter
                        condition: template
                        value_template: |
                          {{
                              (
                                azi < (azi_start_value | int)
                                or azi > (azi_end_value | int)
                                or elv < (elv_start_value | int)
                                or elv > (elv_end_value | int)
                              )
                              and elv < (einbauwinkel | int)
                          }}

                alias: >-
                  Auffahren wenn Wolken (Sonne =1) oder Fenster Außerhalb des Sonnen Bereichs
                sequence:
                  - if:
                    - condition: template
                      value_template: >
                        {{ state_attr(rollladen, 'current_position') | int == (pos_beschattung | int) }}
                      alias: Rolladen steht auf PosBeschattung
                    then:
                    - service: cover.set_cover_position
                      target:
                        entity_id: !input rollladen
                      data:
                        position: !input pos_offen

                  - service: input_text.set_value
                    target:
                      entity_id: !input json_entity
                    data:
                      value: >-
                        {% set raw = states(json_entity) %}
                        {% set current = raw | from_json if raw not in ['unknown', 'unavailable', 'none', ''] else {} %}
                        {{ dict(current, **{storage_key: {'zustand': 2, 'fahrten': fahrten | int}}) | to_json }}

              # → Nacht
              - conditions:
                  - condition: template
                    value_template: "{{ sonne == 0 }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ nachts_fahren }}"
                    then:
                      - service: cover.set_cover_position
                        target:
                          entity_id: !input rollladen
                        data:
                          position: !input pos_zu

                  - service: input_text.set_value
                    target:
                      entity_id: !input json_entity
                    data:
                      value: >-
                        {% set raw = states(json_entity) %}
                        {% set current = raw | from_json if raw not in ['unknown', 'unavailable', 'none', ''] else {} %}
                        {{ dict(current, **{storage_key: {'zustand': 1, 'fahrten': fahrten | int}}) | to_json }}
      # ---------------------------------------------------------
      # Zustand ?? → Korrigieren
      # ---------------------------------------------------------
    default:
        - service: input_text.set_value
          target:
            entity_id: !input json_entity
          data:
            value: >-
              {% set raw = states(json_entity) %}
              {% set current = raw | from_json if raw not in ['unknown', 'unavailable', 'none', ''] else {} %}
              {{ dict(current, **{storage_key: {'zustand': 1, 'fahrten': 0}}) | to_json }}
