# v1.20 (2026-08-27)
#  - Added: Je ein optionaler zweiter Einfahr- und Ausfahr-Taster kann konfiguriert werden.
# v1.19 (2026-08-27)
#  - Fix: Event-Entitäten können nun als Einfahr- oder Ausfahr-Switch ausgewählt werden.
# v1.18 (2026-08-27)
#  - Fix: Automatisches Einfahren bei geringer Helligkeit bzw. Sonnenuntergang erhöht nun den retract_count.
# v1.17 (2026-08-27)
#  - Change: Der gemeinsame Offset für Sonnenauf-/untergang und die zeitliche Helligkeitsentprellung
#    wurde in getrennte Werte für Einfahren und Ausfahren aufgeteilt.
# v1.16 (2026-08-23)
#  - Added: Optionaler zweiter Cover-Kanal als Sensoren-Kanal des Aktors.
#    Dieser wird beim Ausfahren immer auf 100 % gesetzt und beim Einfahren nicht angesteuert.
#  - Change: Der optionale zweite Kanal wird als „Sensoren-Kanal“ bezeichnet.
# v1.15 (2026-08-23)
#  - Change: Die Markise wird jetzt direkt über eine Cover-Entität in Prozent gesteuert.
#    Einfahren setzt die Position immer auf 0 %, die Ausfahrposition ist konfigurierbar.
#  - Added: Neue Eingänge für die Markisen-Cover-Entität und die gewünschte Ausfahrposition.
# v1.14 (2026-08-23)
#  - Change: Markisenstatus-Sensor ist jetzt ein numerischer Prozent-Sensor (0-100%) statt eines
#    Binärsensors. Neuer Schwellenwert-Input bestimmt, ab wann die Markise als "ausgefahren" gilt
#    (100% = ausgefahren, 0% = eingefahren).
# v1.13 (2026-08-23)
#  - Change: Die drei Helfer (2x input_boolean, 1x counter) wurden durch einen einzigen
#    input_text-Helfer ersetzt, der den Zustand als JSON speichert:
#    {"retracted": false, "extended": false, "retract_count": 0}
# v1.12 (2026-08-23)
#  - Change: Regensensor ist jetzt ein binärer Sensor (on/off) statt eines numerischen Statistik-Sensors mit Schwellenwert
#  - Removed: Eingabe "Regenschwelle (mm)" entfällt, da nicht mehr benötigt
# v1.11 (2026-08-16)
#  - Fix: Automatisches Ausfahren bei nachlassendem Wind prüft nun bei aktiver Nachtsteuerung zwingend, ob Helligkeit/Tageslicht gegeben ist


blueprint:
  name: Markisenwächter v1.20
  description: |
    Dieser Blueprint bietet eine erweiterte Automatisierung für eine Markise basierend auf verschiedenen Sensordaten wie Wind und Regen.
    ### Funktionen:
    * **Windüberwachung:** Fährt die Markise automatisch ein, wenn eine konfigurierbare Windgeschwindigkeit überschritten wird.
    * **Regenüberwachung:** Fährt die Markise automatisch ein, wenn ein binärer Regensensor Regen meldet.
    * **Wind-Timeout:** Fährt die Markise sicherheitshalber ein, wenn der Windsensor für eine bestimmte Zeit nicht erreichbar ist.
    * **Sensor-Überwachung:** Sendet eine Benachrichtigung, wenn wichtige Sensoren wie Wind, Markisenstatus oder die Steuerungs-Switches nicht erreichbar sind.
    * **Automatisches Ausfahren:** Fährt die Markise wieder aus, wenn der Wind unter den Grenzwert fällt und kein Regen erkannt wird (sowie bei aktiver Nachtsteuerung ausreichend Helligkeit/Tageslicht herrscht).
    * **Zählerschutz:** Zählt die automatischen Einfahrvorgänge. Bei Überschreiten eines Grenzwertes wird eine Benachrichtigung gesendet und ein weiteres Ausfahren unterbunden, um ein häufiges, unnötiges Ein- und Ausfahren zu verhindern.
    * **Manuelle Steuerung:** Erkennt manuelle Eingriffe (Aus- und Einfahren) und setzt interne Zähler zurück oder passt den Status an.
    * **Täglicher Reset:** Setzt den Einfahr-Zähler und den internen Status täglich zurück.
    * **Tag-/Nachtautomatik:** Fährt die Markise bei Sonnenauf-/untergang (oder Über-/Unterschreiten eines eingestellten Helligkeitswertes) automatisch aus/ein.
    ### Notwendige Konfiguration:
    Dieser Blueprint erfordert die Konfiguration eines einzigen Status-Helfers in Home Assistant:
    1.  Ein `input_text`-Helfer, in dem der interne Status als JSON gespeichert wird.
        **Anlegen des Helfers:**
        `Einstellungen → Geräte & Dienste → Helfer → Helfer erstellen → Text`
        * **Minimale Länge:** 0
        * **Maximale Länge:** 255 (oder höher)
        * **Anfangswert (empfohlen):** `{"retracted": false, "extended": false, "retract_count": 0}`
        (Ist der Anfangswert leer, verwendet der Blueprint automatisch diesen Standardwert.)
    
  domain: automation
  
  input:
    marquise_retract_switch:
      name: Markise Einfahr-Switch
      description: |
        **Switch/Button/Cover/Event-Entity**, womit die Markise eingefahren wird.
        (z.B. `switch.markise_einfahren` oder `event.mobil_fernbedienung_1`)
      selector:
        entity:
          domain:
            - switch
            - button
            - cover
            - event
    marquise_retract_switch_2:
      name: Optionaler zweiter Markise Einfahr-Switch
      description: |
        Optionaler zweiter **Switch/Button/Cover/Event-Entity**, womit die Markise eingefahren wird.
        Leer lassen, wenn kein zweiter Eingang verwendet wird.
      default: []
      selector:
        entity:
          domain:
            - switch
            - button
            - cover
            - event
    marquise_extend_switch:
      name: Markise Ausfahr-Switch
      description: |
        **Switch/Button/Cover/Event-Entity**, womit die Markise ausgefahren wird.
        (z.B. `switch.markise_ausfahren`)
      selector:
        entity:
          domain:
            - switch
            - button
            - cover
            - event
    marquise_extend_switch_2:
      name: Optionaler zweiter Markise Ausfahr-Switch
      description: |
        Optionaler zweiter **Switch/Button/Cover/Event-Entity**, womit die Markise ausgefahren wird.
        Leer lassen, wenn kein zweiter Eingang verwendet wird.
      default: []
      selector:
        entity:
          domain:
            - switch
            - button
            - cover
            - event
    marquise_cover:
      name: Markise Cover-Entität
      description: |
        Die **Cover-Entität**, über die die Markise direkt auf eine Position gefahren wird.
        Einfahren setzt die Position immer auf 0 %. Ausfahren setzt den unten konfigurierten Prozentwert.
        (z.B. `cover.markise`)
      selector:
        entity:
          domain: cover
    marquise_extend_position:
      name: Ausfahrposition der Markise (%)
      description: |
        Die Position, auf die die Markise beim automatischen Ausfahren gefahren wird.
        Einfahren erfolgt immer auf 0 %.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: box
    sensors_channel:
      name: Optionaler Sensoren-Kanal
      description: |
        Optionaler zweiter **Cover-Kanal** des Aktors für die Sensorensteuerung.
        Dieser Kanal wird beim Ausfahren immer auf 100 % gesetzt.
        Leer lassen, wenn kein Sensoren-Kanal verwendet wird.
      default: []
      selector:
        entity:
          domain: cover
          multiple: false
    wind_sensor:
      name: Windsensor-Entität
      description: |
        Der **Numerische Sensor** der die aktuelle Windgeschwindigkeit in km/h misst.
        (z.B. `sensor.ecowitt_ws90_wind_max`)
      selector:
        entity:
          domain: sensor
          multiple: false
          filter:
            - device_class: wind_speed
    enable_night_control:
      name: Tag-/Nachtsteuerung aktivieren
      description: |
        Schalter, ob die Markise in der Nacht automatisch eingefahren und am Morgen automatisch ausgefahren werden soll.
      default: false
      selector:
        boolean: {}
    light_sensor:
      name: Helligkeitssensor (optional)
      description: |
        Ein **Helligkeitssensor in Lux (lx)**.
        Wenn kein Sensor angegeben ist, wird automatisch die **Sun-Integration** (`sensor.sun_next_rising` / `sensor.sun_next_setting`) genutzt.
      default: []
      selector:
        entity:
          domain: sensor
          multiple: false
          filter:
            - device_class: illuminance
    light_threshold:
      name: Helligkeitsschwellenwert (Lux)
      description: |
        **Schwellenwert in Lux (lx)**, bei dessen Unterschreitung die Markise eingefahren und bei dessen Überschreitung die Markise ausgefahren wird.
      default: 5000
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: lx
          mode: box
    time_offset_retract:
      name: Offset Einfahren für Sonnenuntergang (Minuten) / Helligkeitsunterschreitung
      description: |
        **Mit Helligkeitssensor:**
        Der eingestellte Helligkeitswert muss um X Minuten unterschritten werden, damit die Markise einfährt.
        Das soll verhindern, dass kurzzeitig vorbeiziehende Wolken die Markise zum "Pendeln" bringen.
        
        **Ohne Helligkeitssensor:**
        Die Markise wird X Minuten **vor** Sonnenuntergang eingefahren
        (basierend auf der **Sun-Integration** und deren Entität `sensor.sun_next_setting`).
      default: 15
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: box
    time_offset_extend:
      name: Offset Ausfahren für Sonnenaufgang (Minuten) / Helligkeitsüberschreitung
      description: |
        **Mit Helligkeitssensor:**
        Der eingestellte Helligkeitswert muss um X Minuten überschritten werden, damit die Markise ausfährt.
        Das soll verhindern, dass kurzzeitig vorbeiziehende Wolken die Markise zum "Pendeln" bringen.

        **Ohne Helligkeitssensor:**
        Die Markise wird X Minuten **nach** Sonnenaufgang ausgefahren
        (basierend auf der **Sun-Integration** und deren Entität `sensor.sun_next_rising`).
      default: 15
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: box
    rain_sensor:
      name: Regensensor-Entität
      description: |
        Der **Binäre Sensor**, der erkennt, ob aktuell Regen vorliegt.
        (`on` = Regen erkannt, `off` = kein Regen)
        (z.B. `binary_sensor.regen_erkannt`)
      selector:
        entity:
          domain: binary_sensor
          multiple: false
          filter:
            - device_class: moisture
    marquise_status_sensor:
      name: Markisenstatus-Sensor
      description: |
        Der **Numerische Sensor**, der die aktuelle Position der Markise in Prozent angibt.
        (100 % = vollständig ausgefahren, 0 % = vollständig eingefahren)
        (z.B. `sensor.markise_position`)
      selector:
        entity:
          domain: sensor
          multiple: false
    marquise_status_threshold:
      name: Schwellenwert Markisenstatus (%)
      description: |
        Der Prozentwert, ab dem die Markise als „ausgefahren" gilt.
        Werte **unterhalb** dieses Wertes gelten als „eingefahren", Werte **ab** diesem Wert als „ausgefahren".
        (Standard: 50 %)
      default: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    wind_max_threshold:
      name: Maximale Windschwelle (km/h)
      description: |
        Der numerische Wert in km/h, ab dem die Markise automatisch eingefahren wird.
        (Standard: 27 km/h)
      default: 27
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: km/h
          mode: box
    wind_min_threshold:
      name: Minimale Windschwelle (km/h)
      description: |
        Der numerische Wert in km/h, unter den die Windgeschwindigkeit fallen muss, damit die Markise wieder automatisch ausgefahren wird.
        (Standard: 20 km/h)
      default: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: km/h
          mode: box
    automatic_extend_timeout_minutes:
      name: Zeitspanne für automatisches Ausfahren (Minuten)
      description: |
        Die Zeit in Minuten, die vergehen muss, nachdem Wind und Regen unter den Grenzwert gefallen sind, bevor die Markise wieder ausfährt.
        (Standard: 30 Minuten)
      default: 30
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
          mode: box
    wind_sensor_timeout_minutes:
      name: Windsensor-Timeout (Minuten)
      description: |
        Die Zeitspanne in Minuten, nach der ein fehlender Windsensor die Markise automatisch einfährt.
        (Standard: 15 Minuten)
      default: 15
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
          mode: box
    sensors_timeout_minutes:
      name: Sensoren-Timeout (Minuten)
      description: |
        Die Zeitspanne in Minuten, nach der fehlende Sensoren eine Warnung auslösen und versucht wird, die Markise automatisch einzufahren.
        (Standard: 15 Minuten)
      default: 15
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
          mode: box
    automatic_retract_count_threshold:
      name: Zählergrenzwert für automatisches Einfahren
      description: |
        Der numerische Wert, wie oft die Markise automatisch eingefahren werden darf, bevor eine Benachrichtigung gesendet wird.
        (Standard: 2 mal)
      default: 2
      selector:
        number:
          min: 1
          max: 10
          mode: box
    state_helper:
      name: Status-Helfer (JSON)
      description: |
        Ein `input_text`-Helfer, in dem der gesamte interne Status als JSON gespeichert wird:
        `{"retracted": bool, "extended": bool, "retract_count": int}`
      selector:
        entity:
          domain: input_text
    reset_time:
      name: Tägliche Reset-Uhrzeit
      description: |
        Die Uhrzeit, zu der der Zähler und der interne Status täglich zurückgesetzt werden sollen.
        (Standard: 00:00:00)
      default: "00:00:00"
      selector:
        time:

trigger_variables:
  light_sensor_input: !input light_sensor
  time_offset_retract_input: !input time_offset_retract
  time_offset_extend_input: !input time_offset_extend
  state_helper_input: !input state_helper
  retract_threshold_input: !input automatic_retract_count_threshold

trigger:
  # Auslöser: Windgeschwindigkeit über maximalem Schwellenwert
  - platform: numeric_state
    id: trigger_windsensor_max_threshold
    entity_id: !input wind_sensor
    above: !input wind_max_threshold
  # Auslöser: Regen wird vom binären Regensensor erkannt
  - platform: state
    id: trigger_rain_detected
    entity_id: !input rain_sensor
    to: "on"
  # Auslöser: Markise überschreitet den Positions-Schwellenwert -> gilt als "ausgefahren"
  - platform: numeric_state
    id: trigger_marquise_opened
    entity_id: !input marquise_status_sensor
    above: !input marquise_status_threshold
  # Auslöser: Markise unterschreitet den Positions-Schwellenwert -> gilt als "eingefahren"
  - platform: numeric_state
    id: trigger_marquise_closed
    entity_id: !input marquise_status_sensor
    below: !input marquise_status_threshold
  # Auslöser: Windgeschwindigkeit unter minimalem Schwellenwert für eine bestimmte Zeit
  - platform: numeric_state
    id: trigger_windsensor_min_threshold
    entity_id: !input wind_sensor
    below: !input wind_min_threshold
    for:
      minutes: !input automatic_extend_timeout_minutes
  # Auslöser: Windsensor ist nicht verfügbar oder unbekannt für eine bestimmte Zeit
  - platform: state
    id: trigger_windsensor_unknown
    entity_id: !input wind_sensor
    to:
      - unavailable
      - unknown
    for:
      minutes: !input wind_sensor_timeout_minutes
  # Auslöser: Mehrere Sensoren (Wind, Status, Steuerung) sind nicht verfügbar oder unbekannt
  - platform: state
    id: trigger_sensors_unknown
    entity_id:
      - !input wind_sensor
      - !input marquise_status_sensor
      - !input marquise_retract_switch
      - !input marquise_retract_switch_2
      - !input marquise_extend_switch
      - !input marquise_extend_switch_2
      - !input marquise_cover
    to:
      - unavailable
      - unknown
    for:
      minutes: !input sensors_timeout_minutes
  # Auslöser: Der Einfahr-Zähler (aus dem JSON-Status-Helfer) überschreitet den konfigurierten Grenzwert
  - platform: template
    id: trigger_retract_counter
    value_template: >-
      {% set raw = states(state_helper_input) %}
      {% if raw not in ['unknown', 'unavailable', none, ''] %}
        {{ (raw | from_json).retract_count | default(0) | int(0) > (retract_threshold_input | int(0)) }}
      {% else %}
        false
      {% endif %}
  # Auslöser: Tägliches Reset um Mitternacht
  - platform: time
    id: trigger_reset_time
    at: !input reset_time

  # --- MIT HELLIGKEITSSENSOR ---
  # Helligkeit unter Schwellenwert
  - platform: numeric_state
    id: trigger_light_retract
    entity_id: !input light_sensor
    below: !input light_threshold
    for:
      minutes: !input time_offset_retract
  # Helligkeit über Schwellenwert
  - platform: numeric_state
    id: trigger_light_extend
    entity_id: !input light_sensor
    above: !input light_threshold
    for:
      minutes: !input time_offset_extend
  
  # --- OHNE HELLIGKEITSSENSOR (FALLBACK SUN-Entity) ---
  # Zeitpunkt: x Minuten vor Sonnenuntergang
  - platform: template
    id: trigger_sun_retract
    value_template: >-
      {% set sensor = light_sensor_input %}
      {% set setting = states('sensor.sun_next_setting') %}
      {% set offset = time_offset_retract_input | int(0) %}
      {% if (sensor is none or sensor == [] or sensor == '' or sensor == 'none') and setting not in ['unknown', 'unavailable', 'None'] %}
        {{ now() >= (setting | as_datetime | as_local) - timedelta(minutes=offset) }}
      {% else %}
        false
      {% endif %}
  # Zeitpunkt: x Minuten nach Sonnenaufgang
  - platform: template
    id: trigger_sun_extend
    value_template: >-
      {% set sensor = light_sensor_input %}
      {% set rising = states('sensor.sun_next_rising') %}
      {% set offset = time_offset_extend_input | int(0) %}
      {% if (sensor is none or sensor == [] or sensor == '' or sensor == 'none') and rising not in ['unknown', 'unavailable', 'None'] %}
        {{ now() >= (rising | as_datetime | as_local) + timedelta(minutes=offset) }}
      {% else %}
        false
      {% endif %}

condition: []

action:
  - variables:
      wind_speed: !input wind_sensor
      rain_sensor_var: !input rain_sensor
      state_helper: !input state_helper
      marquise_cover_entity: !input marquise_cover
      extend_position: !input marquise_extend_position
      sensors_channel_entity: !input sensors_channel
      retract_max: !input automatic_retract_count_threshold
      light_sensor_var: !input light_sensor
      light_thresh_var: !input light_threshold
      enable_night: !input enable_night_control
      marquise_status_var: !input marquise_status_sensor
      marquise_status_threshold_var: !input marquise_status_threshold
      # Aktuellen Status aus dem JSON-Helfer lesen (mit Fallback auf Standardwerte)
      current_state: >-
        {% set raw = states(state_helper) %}
        {% set default = {"retracted": false, "extended": false, "retract_count": 0} %}
        {% if raw in ['unknown', 'unavailable', none, ''] %}
          {{ default }}
        {% else %}
          {{ raw | from_json }}
        {% endif %}
      is_retracted: "{{ current_state.retracted | default(false) }}"
      is_extended: "{{ current_state.extended | default(false) }}"
      retract_count: "{{ current_state.retract_count | default(0) | int(0) }}"
      # Ob die Markisenposition (in %) über dem Schwellenwert liegt -> gilt als "ausgefahren"
      is_open: >-
        {% set s = states(marquise_status_var) %}
        {% if s not in ['unknown', 'unavailable'] %}
          {{ s | float(0) >= (marquise_status_threshold_var | float(0)) }}
        {% else %}
          false
        {% endif %}
      is_daytime: >
        {% if not enable_night %}
          true
        {% else %}
          {% set sensor = light_sensor_var %}
          {% set threshold = light_thresh_var | float(0) %}
          {% if sensor is defined and sensor not in [none, [], '', 'none'] and states(sensor) not in ['unknown', 'unavailable'] %}
            {{ states(sensor) | float(0) >= threshold }}
          {% else %}
            {% set rising = states('sensor.sun_next_rising') %}
            {% set setting = states('sensor.sun_next_setting') %}
            {% if rising not in ['unknown', 'unavailable', 'None'] and setting not in ['unknown', 'unavailable', 'None'] %}
              {{ (rising | as_datetime) > (setting | as_datetime) }}
            {% else %}
              true
            {% endif %}
          {% endif %}
        {% endif %}
  - choose:
      # Aktion: Starkwind erkannt
      - conditions:
          - condition: trigger
            id:
              - trigger_windsensor_max_threshold
        sequence:
          # Wenn Markise bereits geschlossen ist, tue nichts
          - if:
              - condition: template
                value_template: "{{ not is_open }}"
            then: []
            alias: Wenn Markise geschlossen -> tue nichts
          # Wenn Markise geöffnet ist, fahre sie ein
          - alias: Wenn Markise geöffnet -> Einfahren
            if:
              - condition: template
                value_template: "{{ is_open }}"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count + 1} | tojson }}"
              - alias: Benachrichtigung Starkwind
                service: notify.notify
                data:
                  title: "Starkwind erkannt"
                  message: "Markise wurde wegen Starkwind ({{ states(wind_speed) }} km/h) automatisch eingefahren."
          # Wenn Markisenstatus unbekannt ist, fahre sie sicherheitshalber ein
          - alias: Wenn Markisenstatus unbekannt -> Einfahren
            if:
              - condition: state
                entity_id: !input marquise_status_sensor
                state:
                  - unknown
                  - unavailable
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count} | tojson }}"
              - alias: Benachrichtigung Starkwind (Status unbekannt)
                service: notify.notify
                data:
                  title: "Starkwind - Markisenstatus unbekannt"
                  message: "Markise wurde wegen Starkwind ({{ states(wind_speed) }} km/h) automatisch eingefahren. ACHTUNG: Markisenstatus unbekannt!"
        alias: Starkwind
      # Aktion: Windsensor-Timeout
      - conditions:
          - condition: trigger
            id:
              - trigger_windsensor_unknown
        sequence:
          # Wenn Markise geschlossen ist, tue nichts
          - alias: Markise geschlossen -> tue nichts
            if:
              - condition: template
                value_template: "{{ not is_open }}"
            then: []
          # Wenn Markisenstatus unbekannt, schließe Markise sicherheitshalber
          - alias: Markisenstatus unbekannt -> schließe Markise
            if:
              - condition: state
                entity_id: !input marquise_status_sensor
                state:
                  - unavailable
                  - unknown
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count} | tojson }}"
              - alias: Benachrichtigung Windsensor-Timeout
                service: notify.notify
                data:
                  title: "Windsensor-Timeout"
                  message: "Markise wird eingefahren, da der Windsensor nicht erreichbar ist."
          # Wenn Markise geöffnet ist, schließe Markise
          - alias: Markise geöffnet -> schließe Markise
            if:
              - condition: template
                value_template: "{{ is_open }}"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count} | tojson }}"
              - alias: Benachrichtigung Windsensor-Timeout
                service: notify.notify
                data:
                  title: "Windsensor-Timeout"
                  message: "Markise wird eingefahren, da der Windsensor nicht erreichbar ist."
        alias: Windsensor-Timeout
      # Aktion: Regen erkannt
      - conditions:
          - condition: trigger
            id:
              - trigger_rain_detected
        sequence:
          # Wenn Markise geschlossen ist, tue nichts
          - alias: Markise geschlossen -> tue nichts
            if:
              - condition: template
                value_template: "{{ not is_open }}"
            then: []
          # Wenn Markisenstatus unbekannt, schließe Markise sicherheitshalber
          - alias: Markisenstatus unbekannt -> schließe Markise
            if:
              - condition: state
                entity_id: !input marquise_status_sensor
                state:
                  - unavailable
                  - unknown
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count} | tojson }}"
              - alias: Benachrichtigung Regen (Status unbekannt)
                service: notify.notify
                data:
                  title: "Regen erkannt - Markisenstatus unbekannt"
                  message: "Markise wird wegen Regen eingefahren. Status unbekannt!"
          # Wenn Markise geöffnet ist, schließe Markise
          - alias: Markise geöffnet -> schließe Markise
            if:
              - condition: template
                value_template: "{{ is_open }}"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count} | tojson }}"
              - alias: Benachrichtigung Regen erkannt
                service: notify.notify
                data:
                  title: "Regen erkannt"
                  message: "Markise wird wegen Regen eingefahren."
        alias: Regen
      # Aktion: Tag-/Nachtsteuerung -> Einfahren bei Dunkelheit / Abend
      - conditions:
          - condition: template
            value_template: "{{ enable_night }}"
          - condition: trigger
            id:
              - trigger_light_retract
              - trigger_sun_retract
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_open }}"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count + 1} | tojson }}"
              - alias: Benachrichtigung Dunkelheit
                service: notify.notify
                data:
                  title: "Dunkelheit / Abend"
                  message: "Markise wird wegen geringer Helligkeit bzw. Sonnenuntergang automatisch eingefahren."
          - if:
              - condition: state
                entity_id: !input marquise_status_sensor
                state:
                  - unknown
                  - unavailable
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count} | tojson }}"
              - alias: Benachrichtigung Dunkelheit
                service: notify.notify
                data:
                  title: "Dunkelheit / Abend - Markisenstatus unbekannt"
                  message: "Versuche, Markise wegen geringer Helligkeit bzw. Sonnenuntergang automatisch einzufahren."
          - if:
              - condition: template
                value_template: "{{ not is_open }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count} | tojson }}"
        alias: Tag/Nacht - Einfahren
      # Aktion: Tag-/Nachtsteuerung -> Ausfahren bei Helligkeit / Morgen
      - conditions:
          - condition: template
            value_template: "{{ enable_night }}"
          - condition: trigger
            id:
              - trigger_light_extend
              - trigger_sun_extend
        sequence:
          - if:
              - condition: and
                conditions:
                  - condition: numeric_state
                    entity_id: !input wind_sensor
                    below: !input wind_max_threshold
                  - condition: state
                    entity_id: !input rain_sensor
                    state: "off"
                  - condition: template
                    value_template: "{{ retract_count <= (retract_max | int(0)) }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ not is_open }}"
                then:
                  - service: cover.set_cover_position
                    target:
                      entity_id: "{{ marquise_cover_entity }}"
                    data:
                      position: "{{ extend_position | int(100) }}"
                  - if:
                      - condition: template
                        value_template: "{{ sensors_channel_entity not in [none, '', [], 'none'] }}"
                    then:
                      - service: cover.set_cover_position
                        target:
                          entity_id: "{{ sensors_channel_entity }}"
                        data:
                          position: 100
                  - service: input_text.set_value
                    target:
                      entity_id: !input state_helper
                    data:
                      value: "{{ {'retracted': false, 'extended': true, 'retract_count': retract_count} | tojson }}"
                  - alias: Benachrichtigung Helligkeit
                    service: notify.notify
                    data:
                      title: "Helligkeit / Morgen"
                      message: "Markise wurde wegen ausreichender Helligkeit bzw. Sonnenaufgang automatisch ausgefahren."
        alias: Tag/Nach - Ausfahren
      # Aktion: Manuelles Ausfahren
      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id:
                  - trigger_marquise_opened
              - condition: template
                value_template: "{{ not is_extended }}"
        sequence:
          - if:
              - condition: numeric_state
                entity_id: !input wind_sensor
                above: !input wind_max_threshold
            then:
              - alias: Benachrichtigung manuell Ausgefahren trotz Starkwind
                service: notify.notify
                data:
                  title: "Markisenwächter - WARNUNG"
                  message: "Die Markise wurde trotz Starkwind manuell ausgefahren. Das automatische Einfahren ist bis zum UNTERschreiten des Schwellenwertes INAKTIV!"
          - if:
              - condition: template
                value_template: "{{ retract_count > 0 }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': is_retracted, 'extended': is_extended, 'retract_count': 0} | tojson }}"
              - alias: Benachrichtigung Manuell Ausgefahren
                service: notify.notify
                data:
                  title: "Markise manuell ausgefahren"
                  message: "Der Markisen-Zähler wurde durch manuelles Ausfahren zurückgesetzt."
        alias: Markise manuell ausgefahren
      # Markise wurde automatisch ausgefahren - verhindert Fallback auf den Default-Block
      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id:
                  - trigger_marquise_opened
              - condition: template
                value_template: "{{ is_extended }}"
        sequence: [] # Tue nichts, da die Aktion bereits durch einen anderen Block ausgelöst wurde
        alias: Automatisch ausgefahren - tue nichts
      # Aktion: Manuelles Einfahren
      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id:
                  - trigger_marquise_closed
              - condition: template
                value_template: "{{ not is_retracted }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input state_helper
            data:
              value: "{{ {'retracted': is_retracted, 'extended': false, 'retract_count': retract_count} | tojson }}"
        alias: Markise manuell eingefahren
      # Markise wurde automatisch eingefahren - verhindert Fallback auf den Default-Block
      - conditions:
          - condition: and
            conditions:
              - condition: trigger
                id:
                  - trigger_marquise_closed
              - condition: template
                value_template: "{{ is_retracted }}"
        sequence: [] # Tue nichts, da die Aktion bereits durch einen anderen Block ausgelöst wurde
        alias: Automatisch eingefahren - tue nichts
      # Aktion: Zählerschutz-Benachrichtigung
      - conditions:
          - condition: trigger
            id:
              - trigger_retract_counter
        sequence:
          - alias: Benachrichtigung Zählerschutz
            service: notify.notify
            data:
              title: "Markisen-Zählerschutz aktiv"
              message: "Markise wurde in kurzer Zeit {{ retract_count }} Mal automatisch eingefahren. Automatisches Ausfahren ist gesperrt."
        alias: Benachrichtigung Ausfahrsperre aktiv
      # Aktion: Tägliches Reset
      - conditions:
          - condition: trigger
            id:
              - trigger_reset_time
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input state_helper
            data:
              value: "{{ {'retracted': false, 'extended': false, 'retract_count': 0} | tojson }}"
        alias: Zeitlicher Reset der Automation
      # Aktion: Sensor-Fehlerwarnung
      - conditions:
          - condition: trigger
            id:
              - trigger_sensors_unknown
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_open }}"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': true, 'extended': false, 'retract_count': retract_count + 1} | tojson }}"
              - alias: Benachrichtigung Sensor-Fehler (Einfahren)
                service: notify.notify
                data:
                  title: "Markisenwächter - Sensor-Fehler"
                  message: "Markise wurde eingefahren, da kritische Sensoren nicht erreichbar sind."
          - if:
              - condition: template
                value_template: "{{ not is_open and states(marquise_status_var) not in ['unknown', 'unavailable'] }}"
            then:
              - alias: Benachrichtigung Sensor-Fehler
                service: notify.notify
                data:
                  title: "Markisenwächter - Sensor-Fehler"
                  message: "Achtung! Einer oder mehrere kritische Sensoren des Markisenwächters sind nicht verfügbar!"
          - if:
              - condition: state
                entity_id: !input marquise_status_sensor
                state:
                  - "unavailable"
                  - "unknown"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: 0
              - alias: Benachrichtigung Sensor-Fehler (Status unbekannt)
                service: notify.notify
                data:
                  title: "Markisenwächter - Sensor-Fehler"
                  message: "Achtung! Einer oder mehrere kritische Sensoren des Markisenwächters sind nicht verfügbar! Markise wird sicherheitshalber eingefahren."
        alias: "Warnung: Sensor(en) nicht verfügbar"
      # Aktion: Wind lässt nach, Markise wieder ausfahren
      - conditions:
          - condition: trigger
            id:
              - trigger_windsensor_min_threshold
        sequence:
          - if:
              - condition: and
                conditions:
                  - condition: template
                    value_template: "{{ is_retracted }}"
                  - condition: state
                    entity_id: !input rain_sensor
                    state: "off"
                  - condition: template
                    value_template: "{{ is_daytime | bool }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input state_helper
                data:
                  value: "{{ {'retracted': false, 'extended': true, 'retract_count': retract_count} | tojson }}"
              - service: cover.set_cover_position
                target:
                  entity_id: "{{ marquise_cover_entity }}"
                data:
                  position: "{{ extend_position | int(100) }}"
              - if:
                  - condition: template
                    value_template: "{{ sensors_channel_entity not in [none, '', [], 'none'] }}"
                then:
                  - service: cover.set_cover_position
                    target:
                      entity_id: "{{ sensors_channel_entity }}"
                    data:
                      position: 100
              - alias: Benachrichtigung Wind lässt nach
                service: notify.notify
                data:
                  title: "Wind lässt nach"
                  message: "Windstärke ({{ states(wind_speed) }} km/h) ist unter den Schwellenwert gefallen und es regnet nicht. Markise wird wieder ausgefahren."
        alias: Wind lässt nach
    # Standardaktion, wenn kein Trigger zutrifft
    default:
      - alias: Benachrichtigung unbekannter Fehler
        service: notify.notify
        data:
          title: "Markisenwächter - Fehler"
          message: "Ein Fehler oder eine unbekannte Situation ist aufgetreten. Bitte überprüfe das Log und die Sensoren/Steuerungen."

mode: single