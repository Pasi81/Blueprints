blueprint:
  name: Rollladensteuerung über Event-Taster (Kurz/Lang/Stop + Systemvariable)
  description: >
    ## 🧭 Universelle Rollladensteuerung über Event‑Taster

    Dieser Blueprint steuert einen Rollladen mithilfe frei wählbarer Taster,
    die ihre Aktionen als `state_changed`‑Events an Home Assistant senden.

    Unterstützt werden **Kurz‑ und Langdruck**, **Loslassen**  
    sowie **Stop bei erneutem Tastendruck**.

    Zusätzlich wird eine **Homematic‑Systemvariable** eingebunden,
    die beim Zustandswechsel eine Aktion auslöst (z. B. „Alle Rollläden auf“).

    Der Blueprint funktioniert mit allen Geräten, die Tastendrücke als
    Event‑Entities bereitstellen, z. B.:

    ```
    event.schalter_wohnzimmer_taste1
    event.funkmodul_arbeitszimmer_button2
    event.zigbee_remote_button3
    ```

    Die tatsächliche Tastaktion (press_short, press_long, press_long_release)
    wird aus dem Attribut `new_state.attributes.event_type` ausgelesen.

    ---

    ## 🔧 Unterstützte Funktionen

    ### ✔ Kurz‑Druck
    * AUF‑Taste → Rollladen öffnen  
    * ZU‑Taste → Rollladen schließen  

    ### ✔ Lang‑Druck
    * AUF‑Taste → Rollladen fährt hoch, solange gedrückt  
    * ZU‑Taste → Rollladen fährt runter, solange gedrückt  

    ### ✔ Loslassen
    * Stoppt die Bewegung nach einem Langdruck  

    ### ✔ Stop bei erneutem Tastendruck
    Wenn der Rollladen gerade fährt und eine beliebige konfigurierte Taste erneut
    gedrückt wird, stoppt der Rollladen sofort.

    ### ✔ Homematic‑Systemvariable
    Wenn die Variable ihren Zustand ändert, wird eine definierte Aktion ausgeführt
    (z. B. Rollladen öffnen).

    ---

    ## 🎛️ Konfiguration

    ### 🟦 1. Taster auswählen
    * 1 Pflicht‑Paar (AUF 1 / ZU 1)
    * 3 optionale Paare (AUF 2–4 / ZU 2–4)

    ### 🟦 2. Rollladen auswählen
    Wähle das Cover‑Entity deines Rollladens.

    ### 🟦 3. Homematic‑Variable auswählen
    Diese Variable löst beim Zustandswechsel eine Aktion aus.

    ---

    ## 🧩 Hinweise

    * Der Blueprint reagiert ausschließlich auf `state_changed`‑Events.
    * Optional nicht belegte Taster werden automatisch ignoriert.
    * Die Variable ist Pflicht und wird immer berücksichtigt.

    ---

    ## 🏁 Fertig!
    Nach dem Speichern ist die Automation sofort einsatzbereit.


  domain: automation

  input:
    hm_auf_1:
      name: Taste Auf (Pflicht)
      selector:
        entity:
          domain: event

    hm_zu_1:
      name: Taste Zu (Pflicht)
      selector:
        entity:
          domain: event

    hm_auf_2:
      name: Taste Auf (optional 1)
      default: ""
      selector:
        entity:
          domain: event

    hm_zu_2:
      name: Taste Zu (optional 1)
      default: ""
      selector:
        entity:
          domain: event

    hm_auf_3:
      name: Taste Auf (optional 2)
      default: ""
      selector:
        entity:
          domain: event

    hm_zu_3:
      name: Taste Zu (optional 2)
      default: ""
      selector:
        entity:
          domain: event

    hm_auf_4:
      name: Taste Auf (optional 3)
      default: ""
      selector:
        entity:
          domain: event

    hm_zu_4:
      name: Taste Zu (optional 3)
      default: ""
      selector:
        entity:
          domain: event

    cover:
      name: Rollladen
      selector:
        entity:
          domain: cover

    hm_variable:
      name: Homematic Systemvariable „Alle Rollläden auf“
      description: Diese Variable löst das Öffnen des Rollladens aus.
      selector:
        entity:
          domain: sensor


mode: restart

trigger:
  - platform: event
    event_type: state_changed

  - platform: state
    entity_id: !input hm_variable


variables:
  cover: !input cover
  hm_var: !input hm_variable

  auf_taster:
    - !input hm_auf_1
    - !input hm_auf_2
    - !input hm_auf_3
    - !input hm_auf_4

  zu_taster:
    - !input hm_zu_1
    - !input hm_zu_2
    - !input hm_zu_3
    - !input hm_zu_4


condition:
  - condition: template
    value_template: >
      {% if trigger.platform == 'state' %}
        true
      {% else %}
        {% set eid = trigger.event.data.entity_id %}
        {% set auf = auf_taster | reject('equalto', '') | list %}
        {% set zu = zu_taster | reject('equalto', '') | list %}
        {{ eid in auf or eid in zu }}
      {% endif %}


action:
  - choose:

      # --- Homematic Variable ---
      - conditions: "{{ trigger.platform == 'state' }}"
        sequence:
          - service: cover.open_cover
            target:
              entity_id: "{{ cover }}"

      # --- Event-Taster ---
      - conditions: "{{ trigger.platform == 'event' }}"
        sequence:

          - variables:
              event_type: "{{ trigger.event.data.new_state.attributes.event_type }}"
              eid: "{{ trigger.event.data.entity_id }}"

          - choose:

              # --- STOPPEN wenn Rollladen fährt und Taste erneut gedrückt ---
              - conditions: >
                  {{ (is_state(cover, 'opening') or is_state(cover, 'closing'))
                     and eid in (auf_taster + zu_taster)
                     and event_type == 'press_short' }}
                sequence:
                  - service: cover.stop_cover
                    target:
                      entity_id: "{{ cover }}"

              # --- AUF: Kurz ---
              - conditions: >
                  {{ event_type == 'press_short' and eid in auf_taster }}
                sequence:
                  - service: cover.open_cover
                    target:
                      entity_id: "{{ cover }}"

              # --- ZU: Kurz ---
              - conditions: >
                  {{ event_type == 'press_short' and eid in zu_taster }}
                sequence:
                  - service: cover.close_cover
                    target:
                      entity_id: "{{ cover }}"

              # --- AUF: Loslassen ---
              - conditions: >
                  {{ event_type == 'press_long_release' and eid in auf_taster }}
                sequence:
                  - service: cover.stop_cover
                    target:
                      entity_id: "{{ cover }}"

              # --- AUF: Lang ---
              - conditions: >
                  {{ event_type == 'press_long' and eid in auf_taster }}
                sequence:
                  - service: cover.open_cover
                    target:
                      entity_id: "{{ cover }}"

              # --- ZU: Loslassen ---
              - conditions: >
                  {{ event_type == 'press_long_release' and eid in zu_taster }}
                sequence:
                  - service: cover.stop_cover
                    target:
                      entity_id: "{{ cover }}"

              # --- ZU: Lang ---
              - conditions: >
                  {{ event_type == 'press_long' and eid in zu_taster }}
                sequence:
                  - service: cover.close_cover
                    target:
                      entity_id: "{{ cover }}"

